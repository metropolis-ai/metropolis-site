# Build the static site with Vite and publish it to GitHub Pages.
#
# This replaces the previous "deploy from branch root" (legacy) Pages build:
# the site is now a React app composed from @polis/marketing-site-kit, so the
# served artifact must be produced by `vite build`. The OUTPUT is still a fully
# static site (HTML/CSS/JS + public assets incl. the encrypted docs.enc.js,
# CNAME, and .nojekyll), served from the same custom domain (gometropolis.ai).
#
# PREREQUISITE APP: this build clones the PRIVATE metropolis-ai/polis git
# dependency, which the default GITHUB_TOKEN cannot access. The private
# metropolis-ai-polis-reader GitHub App is installed only on polis with read-only
# Contents permission. Its Client ID is stored in POLIS_APP_CLIENT_ID and its
# private key in POLIS_APP_PRIVATE_KEY.
#
# The repo's Pages source is switched to "GitHub Actions" automatically by the
# "Configure Pages" step (enablement: true) — no manual Settings → Pages flip is
# needed. See AGENTS.md > "Deploy".
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-progress deploy, but never interrupt a run midway
# such that Pages is left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # polis is a PRIVATE git dependency (metropolis-ai/polis). The default
      # GITHUB_TOKEN has no access to it, and pnpm resolves the dep to the SSH
      # form (git@github.com:metropolis-ai/polis.git — see pnpm-lock.yaml), so the
      # clone fails in CI. Mint a short-lived installation token from the
      # read-only GitHub App, scoped to polis only, then rewrite only the polis
      # SSH/HTTPS URL forms to authenticated HTTPS. metropolis-site's own
      # actions/checkout remains on the default token.
      - name: Create read-only Polis installation token
        id: polis-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.POLIS_APP_CLIENT_ID }}
          private-key: ${{ secrets.POLIS_APP_PRIVATE_KEY }}
          owner: metropolis-ai
          repositories: polis
          permission-contents: read

      - name: Configure GitHub App authentication for private Polis clone
        run: |
          git config --global --add url."https://x-access-token:${POLIS_APP_TOKEN}@github.com/metropolis-ai/polis".insteadOf "git@github.com:metropolis-ai/polis"
          git config --global --add url."https://x-access-token:${POLIS_APP_TOKEN}@github.com/metropolis-ai/polis".insteadOf "https://github.com/metropolis-ai/polis"
        env:
          POLIS_APP_TOKEN: ${{ steps.polis-token.outputs.token }}

      # Its heavy server-only packages (prisma/temporal) are marked neverBuilt in
      # package.json, so this install stays fast and runs no native builds.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # Sets the repo's Pages source to "GitHub Actions" (replacing the legacy
      # branch-root source) and exports Pages metadata for the deploy job.
      # enablement: true makes the action set the Pages build type to "workflow"
      # via the API (needs the pages: write permission granted above), so no
      # manual Settings → Pages flip is required. If token perms ever block this,
      # run once: gh api -X PUT repos/metropolis-ai/metropolis-site/pages -f build_type=workflow
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
